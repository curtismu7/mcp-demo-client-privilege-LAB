name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install and test
        run: |
          npm install
          npm test
      # The vendored shared stylesheet must match the hash pinned when it was last re-vendored.
      - run: STANDALONE_UI_CANONICAL_URL=https://raw.githubusercontent.com/curtismu7/AI-DEMO-Standalone/chore/header-flat-brand-v2/shared/standalone-ui.css bash scripts/check-ui-standard.sh

  # The Dockerfile copies server files by name, so build the image and start it: a module missing from the COPY line
  # (mcpUrl.js, 2026-11-15) crashes the container while every unit test passes.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t mcp-demo-client-ci .
      - name: Start it (mock, no settings file) and wait for the page
        run: |
          docker run -d --name mcpdc -e PORT=6884 -e HOST=0.0.0.0 -p 127.0.0.1:6884:6884 mcp-demo-client-ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:6884/; then echo "page answers after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:6884/
          test "$(docker inspect mcpdc --format '{{.State.Running}} {{.RestartCount}}')" = "true 0"
      - name: Container log
        if: always()
        run: docker logs mcpdc 2>&1 | tail -40 || true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, list never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "FORBIDDEN_STRINGS secret is empty"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"
      - name: No AI attribution in the tree or recent commits
        run: bash scripts/check-no-ai-attribution.sh

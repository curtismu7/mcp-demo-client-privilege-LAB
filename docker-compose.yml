# Local standalone compose. Published loopback-only; joins the shared lab-proxy by its
# compose network (the proxy resolves mcp-demo-client-privilege-lab-app-1 at request time).
services:
  app:
    build: .
    image: mcp-demo-client-privilege-lab:local
    container_name: mcp-demo-client-privilege-lab-app-1
    environment:
      PORT: 6884
      HOST: 0.0.0.0
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      # The lab-proxy's Host for this lab (on port 6884); writes through it must carry the proxy's own Origin. Loopback always works.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-mcp-demo-client.local.ping-devops.com}
    ports:
      - "127.0.0.1:6884:6884"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
